name: Deploy cloud

# Production: only a v* release tag on main (tags are owner-only, see the
# "Protect release tags" ruleset; the production environment only releases its
# secrets to v* tags). Staging: started by hand for any branch; the staging
# environment needs the owner's approval before it gets its secrets.
# The laptop's Cloudflare token cannot deploy; this workflow is the only way.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to deploy to staging
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-cloud-${{ github.event_name == 'push' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is vX.Y.Z and on main
        # The Worker refuses other version text (workers/auth.ts), which would fail every request.
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like v2.0.0"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:cloud
      - name: Worker bundles (before any database change)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle" --config workers/wrangler.json --env production
      - name: Database steps
        run: npx wrangler d1 migrations apply BOKLI_DB --remote --env production --config workers/wrangler.json
      - name: Deploy
        run: npx wrangler deploy --config workers/wrangler.json --env production --message "$TAG $GITHUB_SHA" --var "APP_VERSION:$TAG"
      - name: The new version is live and bokli.ktte.me points to it
        run: |
          npx wrangler deployments status --config workers/wrangler.json --env production | tee /dev/stderr | grep -qF "$TAG $GITHUB_SHA"
          bash scripts/cloud-route.sh status | tee /dev/stderr | grep -q '^CLOUD:'

  # Pins the branch to one commit before approval, so the approved code can't change afterwards.
  staging-commit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - id: pin
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Staging will get \`$(git log -1 --format='%h %s')\`" >> "$GITHUB_STEP_SUMMARY"

  staging:
    needs: staging-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.staging-commit.outputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:cloud
      - name: Worker bundles (before any database change)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle" --config workers/wrangler.json --env staging
      - name: Database steps
        run: npx wrangler d1 migrations apply BOKLI_DB --remote --env staging --config workers/wrangler.json
      - name: Deploy
        env:
          REF: ${{ inputs.ref }}
        run: npx wrangler deploy --config workers/wrangler.json --env staging --message "$REF $(git rev-parse --short HEAD)"
