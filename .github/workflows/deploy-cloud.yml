name: Deploy cloud

# Production: only a v* release tag on main (tags are owner-only, see the
# "Protect release tags" ruleset; the production environment only releases its
# secrets to v* tags). Staging: started by hand for any branch; the staging
# environment needs the owner's approval before it gets its secrets.
# The laptop's Cloudflare token cannot deploy; this workflow is the only way.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to deploy to staging
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-cloud-${{ github.event_name == 'push' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:cloud
      - name: Database steps
        run: npx wrangler d1 migrations apply BOKLI_DB --remote --env production --config workers/wrangler.json
      - name: Deploy
        run: npx wrangler deploy --config workers/wrangler.json --env production --message "$TAG $GITHUB_SHA" --var "APP_VERSION:$TAG"
      - name: bokli.ktte.me still points to the Worker
        run: bash scripts/cloud-route.sh status | tee /dev/stderr | grep -q '^CLOUD:'

  staging:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:cloud
      - name: Database steps
        run: npx wrangler d1 migrations apply BOKLI_DB --remote --env staging --config workers/wrangler.json
      - name: Deploy
        env:
          REF: ${{ inputs.ref }}
        run: npx wrangler deploy --config workers/wrangler.json --env staging --message "$REF $(git rev-parse --short HEAD)"
