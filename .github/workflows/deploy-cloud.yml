name: Deploy cloud

# Production only, on a v* release tag on main. Tags are owner-only (the
# "Protect release tags" ruleset) and the production environment only releases
# its secrets to v* tags. The laptop's Cloudflare token cannot deploy; this
# workflow is the only way code reaches Cloudflare.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-cloud-production
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      WRANGLER_SEND_METRICS: "false"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag is vX.Y.Z and on main
        # The Worker refuses other version text (workers/auth.ts), which would fail every request.
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && ${#TAG} -le 80 ]] || { echo "Tag must look like v2.0.0"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:cloud
      - name: Worker bundles (before any database change)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle" --config workers/wrangler.json --env production
      - name: The database has no steps this commit lacks
        # An older commit is fine, but not against database steps it doesn't know (they can't be undone).
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute BOKLI_DB --remote --env production --config workers/wrangler.json --json --command "SELECT name FROM d1_migrations" > "$RUNNER_TEMP/applied.json"
          applied=$(jq -er '.[0].results[].name' "$RUNNER_TEMP/applied.json")
          for m in $applied; do
            [ -f "drizzle/$m" ] || { echo "The database already has $m, which this commit lacks: tag a newer main commit, or roll back in the Cloudflare dashboard"; exit 1; }
          done
      - name: Database steps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply BOKLI_DB --remote --env production --config workers/wrangler.json
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/wrangler.json --env production --message "$TAG $GITHUB_SHA" --var "APP_VERSION:$TAG"
      - name: The new version is live and bokli.ktte.me points to it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deployments status --config workers/wrangler.json --env production | tee /dev/stderr | grep -qF "$TAG $GITHUB_SHA"
          bash scripts/cloud-route.sh status | tee /dev/stderr | grep -q '^CLOUD:'

