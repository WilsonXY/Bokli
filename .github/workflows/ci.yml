name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run (Monday 03:00 MYT) so toolchain drift (runner image, Node or
    # npm updates) shows up even in weeks without PRs.
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Migrations folder is consistent
        run: node scripts/check-migrations.mjs
      - name: Schema changes have a migration
        # drizzle-kit generate only diffs schema.ts against drizzle/meta; the DB
        # path just has to be set (it is never opened).
        env:
          BOKLI_DB_PATH: ${{ runner.temp }}/drift.db
        run: |
          # drizzle-kit can abort with exit 0 (e.g. an outdated snapshot), so
          # also require its explicit "nothing to migrate" verdict.
          timeout 120 npx drizzle-kit generate 2>&1 | tee "$RUNNER_TEMP/drizzle.out"
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            git status --porcelain -- drizzle/
            echo "::error::src/db/schema.ts has changes without a migration. Run npm run db:generate and commit drizzle/."
            exit 1
          fi
          if ! grep -q "No schema changes, nothing to migrate" "$RUNNER_TEMP/drizzle.out"; then
            echo "::error::drizzle-kit generate did not confirm the schema matches the migrations (see output above)."
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Static build
        run: npm run build

  deploy-scripts:
    name: deploy-scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Worker bundle and migration-folder tests
        run: npm run test:deploy

  d1-foundation:
    name: d1-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Real local workerd/D1 tests (synthetic data, no credentials)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: npm run test:d1
