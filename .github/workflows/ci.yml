name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run (Monday 03:00 MYT) so toolchain drift (runner image, Node or
    # npm updates) shows up even in weeks without PRs.
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Migrations folder is consistent
        run: node scripts/check-migrations.mjs
      - name: Schema changes have a migration
        # drizzle-kit generate only diffs schema.ts against drizzle/meta; the DB
        # path just has to be set (it is never opened).
        env:
          BOKLI_DB_PATH: ${{ runner.temp }}/drift.db
        run: |
          # drizzle-kit can abort with exit 0 (e.g. an outdated snapshot), so
          # also require its explicit "nothing to migrate" verdict.
          timeout 120 npx drizzle-kit generate 2>&1 | tee "$RUNNER_TEMP/drizzle.out"
          if [ -n "$(git status --porcelain -- drizzle/)" ]; then
            git status --porcelain -- drizzle/
            echo "::error::src/db/schema.ts has changes without a migration. Run npm run db:generate and commit drizzle/."
            exit 1
          fi
          if ! grep -q "No schema changes, nothing to migrate" "$RUNNER_TEMP/drizzle.out"; then
            echo "::error::drizzle-kit generate did not confirm the schema matches the migrations (see output above)."
            exit 1
          fi

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Install Chromium for the login smoke test
        run: npx playwright install --with-deps --only-shell chromium
      - name: Login smoke test
        run: npm run smoke:ci

  deploy-scripts:
    name: deploy-scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install system tools the deploy tests drive
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q sqlite3 strace
      - run: npm ci --no-audit --no-fund
      - name: Deploy-script tests
        run: npm run test:deploy
