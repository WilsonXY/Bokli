version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major version updates (Next, vitest, better-sqlite3, ...) are planned
    # tasks, not weekly PRs; this also keeps @types/node on prod's Node major
    # (22). Security updates are not affected by this rule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # drizzle is pre-1.0: a "minor" bump can change migrations or query
      # behaviour, so it gets its own PR instead of riding with safe patches.
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
