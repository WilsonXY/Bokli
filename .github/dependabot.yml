version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor/patch bumps in one PR; majors (Next, React, next-auth beta, ...)
      # stay separate so each gets its own review.
      npm-minor-patch:
        update-types: ["minor", "patch"]
